version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledgeos-api
    ports:
      - "8000:8000"
    environment:
      - KNOWLEDGEOS_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=openai/gpt-oss-120b
      - REDIS_DSN=redis://redis:6379/0
      - KNOWLEDGEOS_API_KEY=dev-key
    volumes:
      - knowledgeos_data:/app/.knowledgeos
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: knowledgeos-frontend
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=openai/gpt-oss-120b
      - REDIS_DSN=redis://redis:6379/0
      - KNOWLEDGEOS_API_KEY=dev-key
    volumes:
      - knowledgeos_data:/app/.knowledgeos
    depends_on:
      - api
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: knowledgeos-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: knowledgeos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  knowledgeos_data:
  redis_data:
