[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeos"
version = "0.1.0"
description = "KnowledgeOS - Multi-Agent Research & Knowledge Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.36",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "pdfminer.six>=20221105",
  "pymupdf>=1.24",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledgeos*"]
exclude = ["deploy*", "benchmarks*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


